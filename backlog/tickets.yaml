  - id: M4-4
    list: m4
    title: "knowledge/methods/ — planifier, dériver, entraîner, estimer, reconstruire"
    status: todo
    size: L
    desc: |
      G6. Le savoir de méthode, en texte, qui permet à un modèle de 4 milliards de faire ce
      qu'un solveur faisait : planifier avec la base (inventaire → corpus → plan), dériver un
