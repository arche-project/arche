      - "`arche apps --domain agriculture --mcp` et le filtre catalog_search répondent ; `arche download <app>` prend la dernière stable pour la plateforme courante"
      - docs/en/APPS.md générée depuis le catalogue ; bundles apps-* valides
      - "knowledge/methods/work-with-apps.md : exemple de bout en bout (QGIS ou FreeCAD avec un modèle 4B)"
