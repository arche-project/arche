  - id: M4-14
    list: m4
    title: "Store d'applications (agrégateur) : apps open source par domaine, Linux d'abord, priorité à celles qui ont un MCP"
    status: todo
    size: M
    depends_on:
      - M2-7
      - M2-8
    desc: |
      Demande de Florian : un store d'apps open source — Linux d'abord, Windows et macOS aussi — en priorité celles qui ont un serveur MCP, pour que l'IA locale travaille avec les programmes dédiés (fonderie/usinage, planification agricole, hydraulique/eau, CAO/EDA, SIG, dev) au lieu de tout recoder. ADR 0015 : agrégation — le catalogue décrit, arche download va chercher la dernière stable, rien n'est hébergé. Schéma : `platforms[]`, `mcp{kind, repo, transport, offline}` ; reclasser et compléter par domaine ; recenser les serveurs MCP existants (blender-mcp, freecad-mcp, kicad-mcp, qgis_mcp… à vérifier) ; vue `arche apps` + docs/en/APPS.md ; bundles apps-*.
