# Matériel libre : plans, firmware et documentation de machines qu'on peut fabriquer et réparer soi-même.
# Open hardware: plans, firmware and docs of machines you can build and repair yourself.
# Principe : le logiciel au service du monde physique. Un dépôt Git mirroré = plans (STL/STEP) + firmware + docs, hors-ligne.
# Les licences "matériel" (CERN-OHL, CC BY-SA, NC) sont distinctes des licences logicielles ; le champ license décrit
# la partie la plus restrictive, pour guider la redistribution.

# --- Robotique (LeRobot / Hugging Face) ---

- id: git-lerobot
  type: git-repo
  category: robotics
  name: { fr: "LeRobot (Hugging Face) — IA pour robots", en: "LeRobot (Hugging Face) — AI for robots" }
  description:
    fr: "Bibliothèque de robotique par apprentissage : téléopération, collecte de données, entraînement et déploiement de politiques sur des bras SO-101, Koch, LeKiwi… Documentation complète dans le dépôt."
    en: "Learning-based robotics library: teleoperation, data collection, policy training and deployment on SO-101, Koch, LeKiwi arms… Full docs inside the repo."
  tags: [ robotics, ai, lerobot, huggingface, imitation-learning ]
  languages: [ en ]
  profiles: [ bunker ]
  priority: recommended
  size_estimate_gb: 0.5
  source: { kind: github-repo, github_repo: huggingface/lerobot, url: https://github.com/huggingface/lerobot.git, homepage: https://huggingface.co/lerobot }
  license: { spdx: Apache-2.0, redistribution: allowed }
  requires: { tools: [ git, python3 ] }
  depends_on: [ gitea, pip-cache ]
  update: { tracker: github-release }
  status: unverified
  reliability: reference
  notes:
    fr: "Les modèles et jeux de données LeRobot sont sur Hugging Face (plusieurs Go chacun) : à ajouter au cas par cas via source.kind: huggingface. Le cache pip doit inclure lerobot + torch (CPU) pour l'usage hors-ligne."
    en: "LeRobot models and datasets live on Hugging Face (several GB each): add case by case via source.kind: huggingface. The pip cache must include lerobot + torch (CPU) for offline use."

