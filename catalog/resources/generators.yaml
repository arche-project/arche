# Générateurs : produire des schémas, câblages, pièces et diagrammes EXACTS à partir d'une source.
# Generators: produce EXACT schematics, wiring, parts and diagrams from a source.
#
# ADR 0009 : un schéma est du code ; le rendu en est une vue. Le modèle de langue écrit la source,
# l'outil la rend. Tout ici tourne sans démon (ADR 0008) : binaire statique, Node ou Python autonome.
# Les modèles de diffusion sont en bas du fichier, dans une section à part, parce qu'ils ne font pas
# la même chose : ils illustrent, ils ne produisent pas — et jamais un schéma technique.
#
# ADR 0009: a diagram is code; the rendering is a view. Diffusion models are at the bottom, apart:
# they illustrate, they do not produce — and never a technical diagram.

