- id: git-openweedlocator
  type: git-repo
  category: agriculture
  name: { fr: "OpenWeedLocator (OWL) — détecteur d'adventices sur Raspberry Pi", en: "OpenWeedLocator (OWL) — weed detector on Raspberry Pi" }
  description:
    fr: "Appareil ouvert et bon marché de détection d'adventices par caméra (détection du vert sur sol nu ou entre rangs), qui pilote des relais et électrovannes. Raspberry Pi, MIT. C'est le point de départ réaliste d'un robot désherbeur : la détection existe, il reste l'actionneur (buse, houe, bras) et le châssis."
    en: "Open, low-cost camera-based weed detector (green-on-soil detection in fallow or between rows) driving relays and solenoids. Raspberry Pi, MIT. The realistic starting point for a weeding robot: detection exists; what remains is the actuator (nozzle, hoe, arm) and the chassis."
  tags: [ weeding, vision, raspberrypi, robot, agriculture ]
  languages: [ en ]
  profiles: [ bunker ]
  priority: recommended
  size_estimate_gb: 0.2
  source: { kind: github-repo, github_repo: geezacoleman/OpenWeedLocator, url: https://github.com/geezacoleman/OpenWeedLocator.git, homepage: https://github.com/geezacoleman/OpenWeedLocator }
  license: { spdx: MIT, redistribution: allowed }
  requires: { tools: [ git ] }
  depends_on: [ gitea ]
  update: { tracker: github-commit, check_interval_days: 30 }
  status: active
  reliability: community
  notes: { fr: "Détection par couleur, pas par espèce : ne distingue pas une adventice d'une plantule de culture au même stade. Pour trier par espèce, coupler à un modèle de vision local (Qwen3.5) avec confirmation humaine des premiers passages.", en: "Colour detection, not species: cannot tell a weed from a crop seedling at the same stage. For species sorting, pair with a local vision model (Qwen3.5) and human confirmation of the first passes." }
  version: 46296531dba1
  updated: 2026-04-21
  size_bytes: 39708672
  checked: 2026-09-17

