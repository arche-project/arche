  description:
    fr: "Les fiches de cultures d'OpenFarm.cc (fermé en avril 2025), récupérées via la Wayback Machine : nom botanique, exposition, méthode de semis, espacement (cm), hauteur, degrés-jours, associations. CC0, provenance par fiche. C'est la donnée structurée que lit le planificateur de parcelles d'Arche (knowledge/crops.yaml en est dérivé et complété)."
    en: "The OpenFarm.cc crop records (site closed April 2025), rescued via the Wayback Machine: botanical name, sun, sowing method, spacing (cm), height, growing degree days, companions. CC0, per-record provenance. The structured data Arche's plot planner reads (knowledge/crops.yaml derives from and completes it)."
