  license: { spdx: CC0-1.0, redistribution: allowed }
  requires: { tools: [ git ] }
  update: { tracker: github-commit, check_interval_days: 90 }
  status: active
  reliability: community
  notes: { fr: "Les associations de plantes viennent d'un wiki communautaire, fiabilité variable ; les noms scientifiques ont été recoupés. Pas de fenêtres de semis par climat : Arche les ajoute dans crops.yaml avec leur source.", en: "Companion data comes from a community wiki, variable reliability; scientific names were cross-checked. No sowing windows by climate: Arche adds them in crops.yaml with their source." }
