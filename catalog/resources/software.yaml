- id: hermes-agent
  type: software
  category: ai
  name: { fr: "Hermes Agent (agent autonome local, MCP natif)", en: "Hermes Agent (local autonomous agent, native MCP)" }
  description:
    fr: "Agent open source (Nous Research, MIT, Python) qui tourne sur un modèle local (Ollama, llama.cpp), se branche nativement sur des serveurs MCP — donc sur `arche mcp` — et sait parler à Home Assistant. C'est l'orchestrateur qu'Arche recommande à qui veut des tâches récurrentes (« chaque matin, relève la station météo et dis-moi quoi arroser ») : Arche fournit les outils, l'agent enchaîne. ADR 0011."
    en: "Open-source agent (Nous Research, MIT, Python) running on a local model (Ollama, llama.cpp), with native MCP server support — hence `arche mcp` — and a Home Assistant interface. The orchestrator Arche recommends for recurring tasks ('every morning, read the weather station and tell me what to water'): Arche provides the tools, the agent chains them. ADR 0011."
  tags: [ agent, orchestrator, mcp, offline, llm ]
  languages: [ mul ]
  profiles: [ bunker ]
  priority: optional
  size_estimate_gb: 0.5
  source: { kind: github-repo, github_repo: NousResearch/hermes-agent, url: https://github.com/NousResearch/hermes-agent.git, homepage: https://hermes-agent.nousresearch.com }
  license: { spdx: MIT, redistribution: allowed }
  requires: { tools: [ python3, pip ], ram_gb: 16 }
  depends_on: [ python-standalone, pip-cache, ollama ]
  update: { tracker: github-release }
  status: active
  reliability: community
  runtime: python
  notes: { fr: "Installer depuis le wheelhouse (pas le script curl). Règles Arche : l'agent n'a que les outils MCP d'Arche et les fichiers locaux — aucun « skill » tiers téléchargé ; il ne pilote jamais un actionneur (ADR 0010) ; il tourne sous le superviseur comme un processus ordinaire. Ses canaux Telegram/Discord/WhatsApp sont inutiles hors ligne : rester en CLI ou Home Assistant.", en: "Install from the wheelhouse (not the curl script). Arche rules: the agent gets only Arche's MCP tools and local files — no third-party downloaded 'skills'; it never drives an actuator (ADR 0010); it runs under the supervisor as an ordinary process. Its Telegram/Discord/WhatsApp channels are useless offline: stay on CLI or Home Assistant." }
  version: v2026.9.11
  updated: 2026-09-11
  checked: 2026-09-14

