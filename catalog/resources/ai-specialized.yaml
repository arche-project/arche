# Modèles spécialisés : reclassement, OCR, voix. Ce ne sont pas des « chatbots » — ce sont les
# organes de la bibliothèque : mieux retrouver (reranker), lire les scans (OCR), parler et écouter.
# Specialised models: reranking, OCR, speech — the library's organs, not chatbots.
#
# Critère de sélection (docs/fr/MODELES.md) : la capacité et la couverture du FRANÇAIS, pas la
# nationalité ni le classement. Les modèles chinois dominent l'OCR et le reclassement ; pour la voix
# en français, ce sont whisper.cpp et Piper — parce qu'ils parlent français, et que c'est ce qui compte.

# --- Reclassement (RAG) / Reranking -------------------------------------------------------------

- id: qwen3-reranker-0-6b
  type: ai-model
  category: ai
  name: { fr: "Qwen3-Reranker 0.6B — reclasser les extraits avant de répondre", en: "Qwen3-Reranker 0.6B — rerank passages before answering" }
