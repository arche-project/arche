# --- OCR : lire les scans / OCR: reading scans ------------------------------------------------------
# Une grande part du corpus utile est SCANNÉE : Survivor Library (manuels du XIXe), planches BHL,
# PDF Hesperian, carnets manuscrits. Sans OCR, rien de tout ça n'entre dans l'index (ADR 0007).

- id: ollama-deepseek-ocr
  type: ai-model
  category: ai
  name: { fr: "DeepSeek-OCR 3B — un scan devient du Markdown", en: "DeepSeek-OCR 3B — a scan becomes Markdown" }
  description: { fr: "OCR par modèle vision-langue : une page scannée ou photographiée ressort en Markdown avec ses tableaux et sa mise en page, en très peu de jetons. Pour indexer les manuels scannés et les planches, et pour numériser un carnet de semences manuscrit. Servi par Ollama.", en: "OCR by a vision-language model: a scanned or photographed page comes out as Markdown with its tables and layout, in very few tokens. To index scanned manuals and plates, and to digitise a handwritten seed log. Served by Ollama." }
