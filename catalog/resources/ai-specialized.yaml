# --- Voix : écouter et parler / Speech: listen and speak -------------------------------------------
# Accessibilité : quelqu'un qui ne lit pas bien, qui a les mains occupées, ou qui voit mal doit
# pouvoir POSER sa question et ENTENDRE la réponse. Critère dur : le français.

- id: whisper-cpp
  type: software
  category: ai
  name: { fr: "whisper.cpp — reconnaissance vocale hors ligne, français compris", en: "whisper.cpp — offline speech recognition, French included" }
  description: { fr: "Parler à la bibliothèque. Binaire natif, modèles GGML de 75 Mo (tiny) à 1,5 Go (large), 99 langues dont un très bon français. Sur Raspberry Pi 5, le modèle `small` transcrit en temps quasi réel. Les modèles vocaux chinois (SenseVoice) sont excellents mais ne couvrent pas le français : c'est le critère qui tranche.", en: "Talk to the library. Native binary, GGML models from 75 MB (tiny) to 1.5 GB (large), 99 languages including very good French. On a Raspberry Pi 5 the `small` model transcribes near real time. Chinese speech models (SenseVoice) are excellent but do not cover French: that is the deciding criterion." }
  tags: [ speech, stt, accessibility ]
  languages: [ mul ]
  profiles: [ bunker, novice ]
  priority: recommended
  size_estimate_gb: 0.6
  source: { kind: github-release, github_repo: ggml-org/whisper.cpp, url: https://github.com/ggml-org/whisper.cpp/releases, homepage: https://github.com/ggml-org/whisper.cpp }
  license: { spdx: MIT, redistribution: allowed }
  update: { tracker: github-release, check_interval_days: 30 }
  runtime: static-binary
  status: active
  reliability: reference
  notes:
    fr: "Modèles : https://huggingface.co/ggerganov/whisper.cpp (ggml-small.bin ≈ 466 Mo, ggml-medium.bin ≈ 1,5 Go). Le `small` suffit pour poser une question ; le `medium` pour dicter un carnet."
    en: "Models: https://huggingface.co/ggerganov/whisper.cpp (ggml-small.bin ≈ 466 MB, ggml-medium.bin ≈ 1.5 GB). `small` is enough to ask a question; `medium` to dictate a log."
  version: v1.9.4
  updated: 2026-09-11
  checked: 2026-09-17

