# --- Registres de paquets : proxys-cache locaux / Package registries: local caching proxies -------

- id: verdaccio
  type: software
  category: dev
  name: { fr: "Verdaccio — registre npm local (cache hors-ligne)", en: "Verdaccio — local npm registry (offline cache)" }
  description:
    fr: "Registre npm privé qui met en cache tout ce qu'on installe à travers lui. Recette : le lancer tant que le réseau est là, faire `npm install` des projets à garder (Arche, Gitea, Open WebUI…), puis il sert tout depuis son dossier `storage/` sans réseau. Le seul moyen réaliste d'avoir « npm » hors-ligne."
    en: "Private npm registry that caches everything installed through it. Recipe: run it while the network is up, `npm install` the projects to keep, then it serves everything from `storage/` offline. The only realistic way to have npm offline."
  tags: [ npm, registry, cache, javascript ]
  languages: [ mul ]
  profiles: [ bunker ]
  priority: recommended
  size_estimate_gb: 5
  source: { kind: manual, url: https://verdaccio.org/docs/installation, homepage: https://verdaccio.org }
  license: { spdx: MIT, redistribution: allowed }
  requires: { tools: [ node, npm ] }
  depends_on: [ node-lts ]
  update: { tracker: npm, package: verdaccio, check_interval_days: 14 }
  status: active
  reliability: reference
  notes:
    fr: "Le cache ne contient que ce qu'on a installé : Arche fournit `requirements/npm-offline.txt`, la liste des paquets à réchauffer. La taille dépend entièrement de cette liste."
    en: "The cache only holds what was installed through it: Arche ships `requirements/npm-offline.txt`, the list of packages to warm. Size depends entirely on that list."
  runtime: node
  version: 6.10.4
  updated: 2026-09-20
  checked: 2026-09-24

