# --- ROS 2 : la distribution est l'unité stable / ROS 2: the distribution is the stable unit ------

- id: ros2-apt-mirror
  type: toolchain
  category: robotics
  name: { fr: "ROS 2 — miroir apt de la distribution LTS courante", en: "ROS 2 — apt mirror of the current LTS distribution" }
  description:
    fr: "Paquets Debian de la distribution ROS 2 LTS en cours (`version`), pour Ubuntu, amd64 et arm64, via apt-mirror de packages.ros.org. C'est la seule façon d'installer ROS 2 sans réseau ; les dépôts Git seuls ne suffisent pas. Le tracker suit rosdistro et signale quand la distribution passe en fin de vie ou qu'une LTS plus récente est active."
    en: "Debian packages of the current ROS 2 LTS distribution (`version`), Ubuntu amd64 and arm64, via apt-mirror of packages.ros.org. The only way to install ROS 2 offline; Git repos alone are not enough. The tracker follows rosdistro and flags end-of-life or a newer active LTS."
  tags: [ robotics, ros, apt, mirror ]
  languages: [ mul ]
  profiles: [ bunker ]
  priority: optional
  size_estimate_gb: 25
  version: jazzy
  source: { kind: manual, url: https://docs.ros.org/en/jazzy/Installation/Ubuntu-Install-Debs.html, homepage: https://packages.ros.org/ros2/ubuntu/ }
  license: { spdx: Apache-2.0, redistribution: allowed }
  requires: { os: [ linux ], tools: [ apt ] }
  depends_on: [ apt-mirror-debian ]
  update: { tracker: rosdistro, package: jazzy, stability: lts, check_interval_days: 30 }
  status: active
  reliability: reference
  notes:
    fr: "Une LTS ROS 2 sort les années paires en mai et vit cinq ans (Humble → 2027, Jazzy → 2029). Changer de distribution = changer `update.package` et `version` ensemble. [updater 2026-09-24: une LTS plus récente est active : lyrical]"
    en: "A ROS 2 LTS ships in May of even years and lives five years (Humble → 2027, Jazzy → 2029). Switching distribution = changing `update.package` and `version` together. [updater 2026-09-24: une LTS plus récente est active : lyrical]"
  runtime: none
  checked: 2026-09-24

