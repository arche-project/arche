# Bibliothèques et registres de développement, hors-ligne.
# Development libraries and package registries, offline.
#
# Principe : un dépôt de code sans ses dépendances ne se compile pas. Ce fichier couvre ce qu'il
# faut pour qu'un `npm install`, un `pip install`, un `cargo build` ou un `apt install ros-jazzy-*`
# réussissent sans réseau. Chaque entrée suit la DERNIÈRE VERSION STABLE de son écosystème via
# `update.tracker` (npm, pypi, crates, dockerhub, rosdistro, node-lts, debian) — jamais « la plus
# récente ». Voir src/core/versions.ts et docs/fr/FRAICHEUR.md.
#
# Principle: a code repo without its dependencies does not build. Every entry tracks the LATEST
# STABLE of its ecosystem, never merely the newest.

# --- Runtimes : sans eux, rien ne tourne / Runtimes: nothing runs without them -----------------

