  description:
    fr: "Le système de référence d'Arche : serveur, nœud de bibliothèque, vieux PC de récupération. L'image DVD-1 (≈ 4 Go par architecture) installe un bureau complet SANS réseau, contrairement à la netinst. Pour tout ce qui vient après l'installation : `apt-mirror-debian`."
    en: "Arche's reference system: server, library node, salvaged old PCs. The DVD-1 image (≈ 4 GB per architecture) installs a full desktop WITHOUT network, unlike the netinst. For everything after install: `apt-mirror-debian`."
  tags: [ linux, debian, os, iso, server ]
  languages: [ mul ]
  profiles: [ bunker, novice ]
  priority: essential
  size_estimate_gb: 8
  source: { kind: http, url: https://cdimage.debian.org/debian-cd/current/amd64/iso-dvd/, homepage: https://www.debian.org/CD/, mirrors: [ https://cdimage.debian.org/debian-cd/current/arm64/iso-dvd/ ] }
  checksum: { algo: sha256, value: null, url: https://cdimage.debian.org/debian-cd/current/amd64/iso-dvd/SHA256SUMS }
  license: { spdx: mixed, redistribution: allowed }
  depends_on: [ apt-mirror-debian, ventoy ]
  update: { tracker: debian, check_interval_days: 30 }
  status: active
  reliability: reference
  notes:
    fr: "Prendre `debian-<version>-<arch>-DVD-1.iso` dans le dossier ; le tracker `debian` donne la version courante. Debian stable vit ~5 ans (dont 2 en LTS) : c'est le système qui change le moins, et c'est voulu."
    en: "Take `debian-<version>-<arch>-DVD-1.iso` from the folder; the `debian` tracker gives the current version. Debian stable lives ~5 years: it is the system that changes least, on purpose."
