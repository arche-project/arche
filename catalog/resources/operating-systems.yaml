- id: ubuntu-lts
  type: software
  category: platform
  name: { fr: "Ubuntu LTS (Desktop + Server)", en: "Ubuntu LTS (Desktop + Server)" }
  description:
    fr: "Uniquement parce que ROS 2 cible Ubuntu LTS : les paquets binaires de `ros2-apt-mirror` n'existent que pour cette distribution. Si vous ne faites pas de robotique ROS, Debian suffit et vous épargne un deuxième miroir. Le tracker lit `meta-release-lts`, le fichier qu'Ubuntu consulte lui-même pour proposer une mise à niveau."
    en: "Only because ROS 2 targets Ubuntu LTS: the binary packages of `ros2-apt-mirror` exist for this distribution alone. If you do not do ROS robotics, Debian is enough and spares you a second mirror. The tracker reads `meta-release-lts`, the file Ubuntu itself consults to offer upgrades."
  tags: [ linux, ubuntu, os, iso, robotics ]
  languages: [ mul ]
  profiles: [ bunker ]
  priority: optional
  size_estimate_gb: 9
  source: { kind: http, url: https://releases.ubuntu.com/, homepage: https://ubuntu.com/download, mirrors: [ https://cdimage.ubuntu.com/releases/ ] }
  checksum: { algo: sha256, value: null, url: null }
  license: { spdx: mixed, redistribution: allowed }
  depends_on: [ ros2-apt-mirror ]
  update: { tracker: ubuntu-lts, stability: lts, check_interval_days: 30 }
  status: active
  reliability: reference
  notes:
    fr: "Prévoir aussi un miroir apt Ubuntu partiel (`apt-mirror` sur archive.ubuntu.com, sections main + universe pour amd64 et arm64) : ~60 Go. Sans lui, l'ISO installe et s'arrête là."
    en: "Also plan a partial Ubuntu apt mirror (`apt-mirror` on archive.ubuntu.com, main + universe, amd64 and arm64): ~60 GB. Without it the ISO installs and stops there."
  runtime: none
  version: 24.04.5 LTS (noble)
  updated: 2024-04-25
  checked: 2026-09-17

- id: systemrescue
  type: software
  category: platform
  name: { fr: "SystemRescue — réparer, récupérer, cloner", en: "SystemRescue — repair, recover, clone" }
  description:
    fr: "Système live qui démarre sur n'importe quel PC depuis une clé USB, sans rien installer : réparer une partition, récupérer les fichiers d'un disque qui ne démarre plus, cloner un disque, réinitialiser un mot de passe, tester la mémoire. C'est la trousse de secours ; elle sert avant toute réinstallation."
    en: "Live system that boots any PC from a USB stick without installing: repair a partition, recover files from a disk that no longer boots, clone a drive, reset a password, test memory. The first-aid kit; used before any reinstall."
  tags: [ linux, rescue, recovery, live-usb ]
  languages: [ mul ]
  profiles: [ bunker, novice ]
  priority: essential
  size_estimate_gb: 1
  source: { kind: http, url: https://www.system-rescue.org/Download/, homepage: https://www.system-rescue.org }
  checksum: { algo: sha256, value: null, url: null }
  license: { spdx: GPL-3.0-or-later, redistribution: allowed }
  depends_on: [ ventoy ]
  update: { tracker: http-head, check_interval_days: 30 }
  status: unverified
  reliability: reference
  notes:
    fr: "Pas de dépôt à mettre en miroir : tout est dans l'ISO, c'est le but. Sur la clé Ventoy avec les autres. Le manuel (system-rescue.org/manual) vaut d'être imprimé : on s'en sert quand rien ne marche."
