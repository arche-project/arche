# Systèmes d'exploitation : réinstaller une machine sans réseau.
# Operating systems: reinstalling a machine with no network.
#
# La bibliothèque vit sur un disque ; la machine qui le lit peut mourir. Sans système à réinstaller,
# tout le reste est inaccessible. Deux règles, écrites ici parce qu'elles sont contre-intuitives :
#
#   1. UNE DISTRIBUTION SANS SON DÉPÔT DE PAQUETS EST UNE IMPASSE. L'ISO installe une base ; tout ce
#      qu'on voudra ensuite (Docker, hostapd, KiCad, ROS…) vient du dépôt. Chaque entrée nomme donc
#      son dépôt dans `depends_on`, ou explique pourquoi elle n'en a pas besoin.
#   2. MOINS DE DISTRIBUTIONS, PAS PLUS. Chaque distribution coûte une ISO (2–6 Go) ET un miroir
#      (15–80 Go) ET un tracker de version ET quelqu'un qui sait l'administrer. On choisit par USAGE,
#      pas par goût : une pour le serveur et les vieux PC, une pour le Pi, une pour ROS 2, une pour
#      réparer, une pour les routeurs. Exclus volontairement : Arch (rolling), Fedora (13 mois de
#      vie), NixOS (excellent, mais le cache Nix hors-ligne est un projet en soi), Tails (autre sujet).
#
#   1. A DISTRIBUTION WITHOUT ITS PACKAGE REPOSITORY IS A DEAD END.
#   2. FEWER DISTRIBUTIONS, NOT MORE. One per use, not per taste.
#
# Toutes suivent la DERNIÈRE VERSION STABLE (debian, ubuntu-lts, raspios, github-tag/release).

- id: debian-dvd
