- id: alpine-standard
  type: software
  category: platform
  name: { fr: "Alpine Linux — standard + miroir apk", en: "Alpine Linux — standard + apk mirror" }
  description:
    fr: "Petit (l'ISO fait ~200 Mo), musl, OpenRC, démarre en quelques secondes sur 512 Mo de RAM : un routeur, un vieux PC, un nœud très sobre, ou la base d'un conteneur reconverti en machine réelle. Son dépôt est plat et son index tient en quelques Mo — c'est la distribution la plus facile à mettre en miroir. Recette : `catalog/mirrors/alpine.yaml` ; `arche mirror plan` calcule la fermeture exacte (Alpine n'a pas de Recommends)."
    en: "Small (~200 MB ISO), musl, OpenRC, boots in seconds on 512 MB of RAM: a router, an old PC, a very frugal node, or the base of a container turned into a real machine. Its repository is flat and its index a few MB — the easiest distribution to mirror. Recipe: `catalog/mirrors/alpine.yaml`; `arche mirror plan` computes the exact closure (Alpine has no Recommends)."
  tags: [ linux, alpine, os, iso, musl, lightweight ]
  languages: [ mul ]
  profiles: [ bunker ]
  priority: optional
  size_estimate_gb: 2
  source: { kind: github-repo, github_repo: alpinelinux/aports, url: https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/, homepage: https://alpinelinux.org/downloads/ }
  checksum: { algo: sha256, value: null, url: null }
  license: { spdx: mixed, redistribution: allowed }
  depends_on: [ ventoy ]
  update: { tracker: github-tag, check_interval_days: 30 }
  runtime: none
  status: active
  reliability: reference
  notes:
    fr: "Le tracker lit les tags du miroir GitHub alpinelinux/aports (v3.21.x…). musl ≠ glibc : les binaires précompilés d'Ollama, Node ou Gitea ont besoin de `gcompat` ou d'une version musl — vérifier avant de choisir Alpine pour le nœud Arche ; Debian reste le choix sûr pour ça."
    en: "The tracker reads the tags of the alpinelinux/aports GitHub mirror (v3.21.x…). musl ≠ glibc: prebuilt Ollama, Node or Gitea binaries need `gcompat` or a musl build — check before choosing Alpine for the Arche node; Debian remains the safe choice there."
