  size_estimate_gb: 6
  source: { kind: manual, homepage: https://platformio.org, url: https://docs.platformio.org/en/latest/core/installation/index.html }
  license: { spdx: Apache-2.0, redistribution: allowed, note: { fr: "Les toolchains Espressif embarquées ont leurs propres licences (GPL/Apache).", en: "Bundled Espressif toolchains carry their own licenses (GPL/Apache)." } }
