# Toolchains à mettre en cache pour compiler hors-ligne.
# Toolchains to cache for offline compilation.
# Ces entrées sont de type "manual" : le wizard exécute une recette (scripts/toolchains/<id>.sh) qui remplit un cache local
# à partir des sources officielles, car il n'existe pas d'archive unique à télécharger.

