- id: pip-ml-cache
  type: toolchain
  category: ai
  name: { fr: "Roues Python pour entraîner en local (PyTorch CPU, scikit-learn, PEFT, LeRobot, tinygrad)", en: "Python wheels to train locally (PyTorch CPU, scikit-learn, PEFT, LeRobot, tinygrad)" }
  description:
    fr: "L'autonomiste qui croise ses capteurs (ESP32, température, humidité) avec ses récoltes et ses dates n'a pas besoin qu'un LLM lui réponde : il a besoin d'entraîner son propre modèle. Et celui qui construit un robot n'aura pas les outils NVIDIA. Cette liste (`requirements/ml-offline.txt`) met en cache PyTorch en version CPU (ou ROCm/MPS), scikit-learn pour les petits réseaux et régressions, PEFT pour affiner un modèle de langue par LoRA sur ses propres notes, LeRobot pour les politiques de robot, tinygrad comme moteur minimal lisible de bout en bout. ~2 Go de roues. ADR 0013."
    en: "The self-reliant maker who crosses their sensors (ESP32, temperature, humidity) with their harvests and dates does not need an LLM to answer: they need to train their own model. And the one building a robot will not have NVIDIA's tools. This list (`requirements/ml-offline.txt`) caches PyTorch in its CPU (or ROCm/MPS) build, scikit-learn for small networks and regressions, PEFT to fine-tune a language model with LoRA on their own notes, LeRobot for robot policies, tinygrad as a minimal engine readable end to end. ~2 GB of wheels. ADR 0013."
  tags: [ python, training, pytorch, ml, robotics, cache ]
  languages: [ mul ]
  profiles: [ bunker ]
  priority: recommended
  size_estimate_gb: 2
  source: { kind: manual, homepage: https://pytorch.org/get-started/locally/, url: https://download.pytorch.org/whl/cpu }
  license: { spdx: mixed, redistribution: unclear, note: { fr: "BSD (PyTorch), BSD (scikit-learn), Apache-2.0 (PEFT, LeRobot, transformers), MIT (tinygrad) — roues officielles, redistribution des roues autorisée par leurs licences respectives.", en: "BSD (PyTorch), BSD (scikit-learn), Apache-2.0 (PEFT, LeRobot, transformers), MIT (tinygrad) — official wheels, redistribution allowed by their respective licences." } }
  requires: { tools: [ python3, pip ], ram_gb: 8 }
  depends_on: [ python-standalone ]
  update: { tracker: pypi, package: torch }
  status: active
  reliability: reference
  runtime: python
  notes: { fr: "Sur CPU : un réseau capteurs → récolte s'entraîne en minutes ; une politique ACT LeRobot en heures (file de tâches, ADR 0012). Sur une carte AMD : roues ROCm ; sur Mac : MPS. llama.cpp (déjà au catalogue) affine aussi par LoRA sans PyTorch.", en: "On CPU: a sensors → harvest network trains in minutes; a LeRobot ACT policy in hours (job queue, ADR 0012). On an AMD card: ROCm wheels; on a Mac: MPS. llama.cpp (already in the catalogue) also fine-tunes by LoRA without PyTorch." }
  version: 2.14.0
  updated: 2026-09-02
  checked: 2026-09-14

