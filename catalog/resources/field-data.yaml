  name: { fr: "Meshroom (AliceVision) — photogrammétrie d'objets et de bâtiments, avec GPU", en: "Meshroom (AliceVision) — object and building photogrammetry, with GPU" }
  description:
    fr: "Des photos au téléphone autour d'une pièce cassée, d'une machine, d'un mur → un maillage 3D texturé, à mesurer ou à réimprimer après nettoyage (Blender, OpenSCAD pour la pièce fonctionnelle). MPL-2.0, binaires Linux/Windows. Demande une carte NVIDIA (CUDA) pour la reconstruction dense ; sans GPU, seule la partie éparse tourne. Complémentaire d'ODM (terrain) : ici, l'objet."
    en: "Phone photos around a broken part, a machine, a wall → a textured 3D mesh, to measure or reprint after cleanup (Blender, OpenSCAD for the functional part). MPL-2.0, Linux/Windows binaries. Needs an NVIDIA (CUDA) card for dense reconstruction; without a GPU only the sparse stage runs. Complementary to ODM (terrain): here, the object."
