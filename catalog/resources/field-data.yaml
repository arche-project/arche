  name: { fr: "Frigate — enregistreur vidéo avec détection d'objets (caméras)", en: "Frigate — video recorder with object detection (cameras)" }
  description:
    fr: "NVR libre pour caméras RTSP/ONVIF : détection en temps réel (personne, véhicule, animal) sur CPU, Coral ou GPU, enregistrement sur événement, intégration Home Assistant et MQTT. MIT. Distribué en conteneur Docker uniquement : entre en `optional` (ADR 0008) pour qui accepte Docker sur la machine des caméras. Sans Docker : OpenCV + un petit modèle, ou `motion`."
    en: "Free NVR for RTSP/ONVIF cameras: real-time detection (person, vehicle, animal) on CPU, Coral or GPU, event recording, Home Assistant and MQTT integration. MIT. Shipped as a Docker container only: enters as `optional` (ADR 0008) for those who accept Docker on the camera machine. Without Docker: OpenCV + a small model, or `motion`."
  tags: [ camera, nvr, detection, rtsp, docker ]
  languages: [ mul ]
  profiles: [ bunker ]
  priority: optional
  size_estimate_gb: 1.5
  source: { kind: github-repo, github_repo: blakeblackshear/frigate, url: https://github.com/blakeblackshear/frigate.git, homepage: https://frigate.video }
  license: { spdx: MIT, redistribution: allowed }
  requires: { tools: [ docker ], ram_gb: 8 }
  update: { tracker: github-release }
  status: active
  reliability: community
  runtime: container
  notes: { fr: "Une caméra qui détecte un sanglier dans la parcelle ou un intrus au hangar publie sur MQTT ; Node-RED décide, l'humain agit. Jamais de détection de personne reliée à un actionneur (ADR 0010).", en: "A camera that spots a boar in the field or an intruder at the barn publishes over MQTT; Node-RED decides, the human acts. Never person detection wired to an actuator (ADR 0010)." }
  version: v0.18.0
  updated: 2026-09-12
  checked: 2026-09-24

