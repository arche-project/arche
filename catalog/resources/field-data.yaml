# Données de terrain : photogrammétrie drone, LiDAR, SIG, caméras, capteurs — le lien avec le physique
# pour une exploitation déjà automatisée (ADR 0012). Field data: drone photogrammetry, LiDAR, GIS,
# cameras, sensors — the link to the physical world for an already-automated farm (ADR 0012).
# Vérifié sur les dépôts le 2026-09-11. Voir aussi robotics.yaml (OpenCV), energy.yaml (Home Assistant),
# software.yaml (Node-RED, Hermes Agent, SatDump), git-mirrors.yaml (ESPHome), maps-and-printables.yaml (OSM).

- id: opendronemap
  type: software
  category: agriculture
  name: { fr: "OpenDroneMap (ODM) — photos de drone → orthophoto, MNS/MNT, nuage de points, 3D", en: "OpenDroneMap (ODM) — drone photos → orthophoto, DSM/DTM, point cloud, 3D" }
  description:
    fr: "La chaîne libre de photogrammétrie : des photos de drone (ou de ballon, ou de perche) sortent une orthophoto GeoTIFF géoréférencée, des modèles numériques de surface et de terrain, un nuage de points LAZ et un maillage 3D texturé. AGPL-3.0. Docker est la voie « recommandée » par le projet ; l'installation native existe (Ubuntu 24.04 : `configure.sh install`, Windows : installeur) et c'est celle d'Arche. GPU NVIDIA facultatif (~2× sur l'extraction des points). Sur CPU, une parcelle de 500 photos prend des heures : c'est une tâche de file, pas une conversation."
    en: "The free photogrammetry chain: drone (or balloon, or pole) photos become a georeferenced GeoTIFF orthophoto, digital surface and terrain models, a LAZ point cloud and a textured 3D mesh. AGPL-3.0. Docker is the project's 'recommended' path; native install exists (Ubuntu 24.04: `configure.sh install`, Windows: installer) and is Arche's. Optional NVIDIA GPU (~2× on feature extraction). On CPU a 500-photo field takes hours: a queued job, not a conversation."
  tags: [ drone, photogrammetry, orthophoto, dsm, pointcloud, gis, agriculture ]
  languages: [ mul ]
  profiles: [ bunker ]
  priority: recommended
  size_estimate_gb: 3
  source: { kind: github-repo, github_repo: OpenDroneMap/ODM, url: https://github.com/OpenDroneMap/ODM.git, homepage: https://www.opendronemap.org }
  license: { spdx: AGPL-3.0-only, redistribution: allowed }
  requires: { tools: [ git, python3 ], ram_gb: 16, os: [ linux, windows ] }
  depends_on: [ python-standalone ]
  update: { tracker: github-release }
  status: active
  reliability: reference
  runtime: source
  notes: { fr: "Installation native à préparer AVANT la coupure (elle compile et télécharge des dépendances). 16 Go de RAM pour ~300 photos ; au-delà, découper en lots ou `--fast-orthophoto`. WebODM (interface web) est Docker-only : hors périmètre ; NodeODM en natif suffit pour piloter depuis Node-RED.", en: "Native install to prepare BEFORE the outage (it compiles and downloads dependencies). 16 GB RAM for ~300 photos; beyond, split into batches or `--fast-orthophoto`. WebODM (web UI) is Docker-only: out of scope; native NodeODM is enough to drive from Node-RED." }
  version: v3.6.2
  updated: 2026-08-12
  checked: 2026-09-24

- id: pdal
  type: software
  category: agriculture
  name: { fr: "PDAL — traitement de nuages de points LiDAR (LAS/LAZ)", en: "PDAL — LiDAR point-cloud processing (LAS/LAZ)" }
  description:
    fr: "La bibliothèque et l'outil en ligne de commande des nuages de points : filtrer, classer sol/végétation, rastériser en MNT, calculer des volumes (tas de fumier, réserve d'eau, terrassement), découper par parcelle. BSD-3. Disponible dans les dépôts Debian/Ubuntu (miroir apt d'Arche) et via pip (`pdal`)."
    en: "The point-cloud library and command-line tool: filter, classify ground/vegetation, rasterise to a DTM, compute volumes (manure pile, water reserve, earthworks), clip by field. BSD-3. In the Debian/Ubuntu repositories (Arche's apt mirror) and via pip (`pdal`)."
  tags: [ lidar, pointcloud, dtm, volumes, gis ]
  languages: [ mul ]
  profiles: [ bunker ]
  priority: recommended
  size_estimate_gb: 0.3
  source: { kind: github-repo, github_repo: PDAL/PDAL, url: https://github.com/PDAL/PDAL.git, homepage: https://pdal.io }
  license: { spdx: BSD-3-Clause, redistribution: allowed }
  requires: { tools: [ python3, pip ] }
  depends_on: [ python-standalone, pip-cache ]
  update: { tracker: github-release }
  status: active
  reliability: reference
  runtime: python
  notes: { fr: "Ajouter `pdal` et `python3-pdal` à la recette de miroir apt debian pour l'installation sans pip. Un LiDAR de drone ou de téléphone (iPhone Pro) sort du LAS/LAZ ou de l'E57 : PDAL lit les deux.", en: "Add `pdal` and `python3-pdal` to the debian apt-mirror recipe for a pip-less install. Drone or phone LiDAR (iPhone Pro) outputs LAS/LAZ or E57: PDAL reads both." }
  version: 2.10.2
  updated: 2026-06-12
  checked: 2026-09-24

