- id: qgis
  type: software
  category: maps
  name: { fr: "QGIS — le SIG libre : cartes, parcelles, orthophotos, MNT, 3D", en: "QGIS — the free GIS: maps, fields, orthophotos, DTMs, 3D" }
  description:
    fr: "Superposer ses parcelles, l'orthophoto du drone, le MNT LiDAR, les tuiles satellite téléchargées avant la coupure, les relevés GNSS et les traces de tracteur ; mesurer, découper, faire un plan d'assolement, une vue 3D du terrain (vue 3D intégrée), imprimer une carte. GPL-2.0. Installeurs pour Linux (dépôts, flatpak), macOS, Windows. Lourd (1,5 Go) mais c'est l'atelier cartographique complet, hors ligne, dans lequel tout le reste se rejoint."
    en: "Overlay your fields, the drone orthophoto, the LiDAR DTM, satellite tiles downloaded before the outage, GNSS surveys and tractor tracks; measure, clip, plan rotations, view the terrain in 3D (built-in 3D view), print a map. GPL-2.0. Installers for Linux (repos, flatpak), macOS, Windows. Heavy (1.5 GB) but it is the complete offline mapping workshop where everything else meets."
  tags: [ gis, maps, orthophoto, dtm, 3d, satellite, agriculture ]
  languages: [ mul, fr, en ]
  profiles: [ bunker, novice ]
  priority: recommended
  size_estimate_gb: 1.5
  source: { kind: github-repo, github_repo: qgis/QGIS, url: https://qgis.org/download/, homepage: https://qgis.org }
  license: { spdx: GPL-2.0-or-later, redistribution: allowed }
  requires: { ram_gb: 8 }
  update: { tracker: github-tag, check_interval_days: 30 }
  status: active
  reliability: reference
  runtime: static-binary
  notes: { fr: "Les tuiles satellite (Sentinel-2, IGN) doivent être téléchargées AVANT la coupure et déclarées dans l'inventaire (`datasets`, kind `satellite`) ; QGIS les lit en GeoTIFF/MBTiles sans réseau. Pour la France, le SCAN25 et la BD ORTHO IGN sont sous licence ouverte Etalab.", en: "Satellite tiles (Sentinel-2, national agencies) must be downloaded BEFORE the outage and declared in the inventory (`datasets`, kind `satellite`); QGIS reads GeoTIFF/MBTiles offline. For France, IGN's SCAN25 and BD ORTHO are under the Etalab open licence." }
  version: final-4_2_2
  checked: 2026-09-24

- id: meshroom
