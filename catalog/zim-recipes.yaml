# Recettes de construction des ZIM hébergés par Arche (source.kind: arche-hosted).
# Recipes for the ZIMs Arche builds and hosts.
#
# Règle d'or : une recette ne tourne QUE si `permission` vaut `license` (la licence seule autorise la publication)
# ou `written` (accord écrit archivé dans docs/permissions/<id>.md). `pending` et `none` = construction refusée par le workflow.
# Golden rule: a recipe only runs when `permission` is `license` or `written`. `pending`/`none` are refused by the workflow.
#
# tool: mwoffliner (MediaWiki, via l'API — propre et incrémental) | zimit (n'importe quel site, crawl navigateur) | zimwriterfs (dossier HTML)
# Le workflow zim-build.yml lit ce fichier, construit dans GitHub Actions, envoie sur Internet Archive, puis ouvre une PR
# qui met à jour l'entrée de catalogue `resource` avec l'URL IA, la taille, le sha256, la date.

- id: opensourceecology-en
  resource: git-open-source-ecology          # id de la ressource de catalogue à mettre à jour / catalog resource to update
  tool: mwoffliner
  url: https://wiki.opensourceecology.org
  lang: eng
  name: opensourceecology_en_all
  title: "Open Source Ecology"
  description: "Global Village Construction Set: 50 open-source industrial machines"
  license: CC-BY-SA-4.0
  permission: license
  schedule: quarterly
  ia_item: arche-opensourceecology-en
  mwoffliner_args: ["--format=nopic", "--format=novid:maxi"]
  size_estimate_gb: 1.5

- id: lowtechlab-fr
  resource: git-lowtech-lab
  tool: mwoffliner
  url: https://wiki.lowtechlab.org
  lang: fra
  name: lowtechlab_fr_all
  title: "Low-tech Lab"
  description: "Tutoriels low-tech : énergie, eau, alimentation, habitat, hygiène"
  license: CC-BY-NC-SA-4.0
  permission: pending                         # NC : demander l'accord écrit de l'association avant toute publication
  permission_ref: docs/permissions/lowtechlab-fr.md
  schedule: quarterly
  ia_item: arche-lowtechlab-fr
  mwoffliner_args: ["--format=novid:maxi"]
  size_estimate_gb: 2

- id: reprap-en
  resource: reprap-wiki
  tool: mwoffliner
  url: https://reprap.org
  lang: eng
  name: reprap_en_all
  title: "RepRap"
  description: "Self-replicating open 3D printers"
  license: GFDL-1.2-or-later
  permission: license
  schedule: yearly
  ia_item: arche-reprap-en
  mwoffliner_args: ["--format=novid:maxi"]
  size_estimate_gb: 2

- id: farmhack-en
  resource: git-farm-hack
  tool: zimit
  url: https://farmhack.org/tools
  lang: eng
  name: farmhack_en_all
  title: "Farm Hack"
  description: "Open-source farm tools"
  license: unknown
  permission: none                            # licence non établie : ne pas construire tant que ce n'est pas clarifié
  schedule: yearly
  ia_item: arche-farmhack-en
  zimit_args: ["--scopeType", "host", "--workers", "4", "--sizeLimit", "4000000000"]
  size_estimate_gb: 0.5

