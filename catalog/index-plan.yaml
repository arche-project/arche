# Le plan d'indexation : quelles ressources reçoivent un shard, dans quel ordre, et lesquelles dépassent
# ce qu'un runner GitHub (6 h, CPU) peut embarquer — celles-là attendent un runner GPU ou un lot manuel.
# The indexing plan: which resources get a shard, in what order; ci: false = too big for a GitHub runner.
# Généré depuis le catalogue le 2026-09-11 (type zim ou pdf, priorité puis taille) ; à éditer à la main ensuite.
# ~350 000 chunks par Go de texte, ~30 chunks/s sur CPU : 1 Go ≈ 3 h. Au-dessus de 2 Go : ci: false.
# wave: 1 = la première vague publiée (M4-3, G2) : les vingt plus petits corpus `essential` (≈ 0,4 Go de texte).
# Les locators de knowledge/eval.yaml restent `pending` tant que le shard de leur ressource n'est pas publié.

