# Sur chaque PR qui touche le catalogue (humaine ou robot) : compare les champs sensibles — source.*,
# checksum, size_bytes, license, index.url/sha256 — avec la branche cible, pose ou retire l'étiquette
# `catalog-sensitive`, et affiche le tableau dans le résumé du run. Ce workflow ne fusionne rien :
# une PR `catalog-sensitive` attend deux paires d'yeux (CONTRIBUTING.md ; audit erreur 7, M2-3).
# On every PR touching the catalog: diff the sensitive fields against the base branch, set/remove the
# `catalog-sensitive` label, show the table in the run summary. Never merges anything.
#
# Note : une PR ouverte par GITHUB_TOKEN (catalog-update, zim-build, index-build) ne déclenche pas ce
# workflow — ces trois-là posent l'étiquette eux-mêmes. Une PR venue d'un fork a un jeton en lecture
# seule : l'étiquette échoue sans casser le run, le tableau reste dans le résumé.
name: catalog-review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "catalog/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  sensitive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Sensitive fields vs base branch (url, checksum, size, licence)
        id: sensitive
        run: |
          git fetch origin ${{ github.base_ref }}
          npx tsx scripts/catalog/sensitive-diff.ts --base origin/${{ github.base_ref }}
      - name: Label `catalog-sensitive`
        uses: actions/github-script@v7
        with:
          script: |
            const sensitive = "${{ steps.sensitive.outputs.sensitive }}" === "true";
            const { owner, repo } = context.repo, issue_number = context.payload.pull_request.number, name = "catalog-sensitive";
            try {
              if (sensitive) await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [name] });
              else await github.rest.issues.removeLabel({ owner, repo, issue_number, name }).catch(e => { if (e.status !== 404) throw e; });
            } catch (e) { core.warning(`label ${name}: ${e.message} (fork ? le tableau est dans le résumé du run)`); }
