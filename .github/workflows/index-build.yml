# Construit les shards d'index (ADR 0007, 0013) dans GitHub Actions, les envoie sur Internet Archive,
# et ouvre une PR qui remplit le bloc `index` du catalogue. Des centaines de RAG, hébergés — rien ne
# transite par la machine du mainteneur.
# Builds index shards in GitHub Actions, uploads them to Internet Archive, opens a catalog PR.
#
# Secrets requis / required secrets : IA_ACCESS_KEY, IA_SECRET_KEY (https://archive.org/account/s3.php)
# Limites : 6 h par job, CPU seulement (~30 chunks/s avec bge-m3). Un ZIM de 1 Go ≈ 350 000 chunks ≈ 3 h.
# Au-delà (Wikipédia FR : 13 Go), un runner auto-hébergé avec GPU, ou le découpage par lots — voir HEBERGEMENT.md.
name: index-build

on:
  workflow_dispatch:
    inputs:
      resources:
        description: "Ids de ressources, séparés par des virgules (ex. zimgit-water,stackexchange-gardening). Vide = celles marquées index.build dans catalog/index-plan.yaml"
        required: false
        default: ""
      model:
        description: "Modèle d'embedding (référence ADR 0007 : bge-m3)"
        required: false
        default: "bge-m3"
  schedule:
    - cron: "0 2 15 * *"   # le 15 du mois : reconstruit ce dont la ressource a changé (resource_sha256 ≠ catalogue)

permissions:
  contents: write
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.sel.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - id: sel
        name: Select resources (explicit list, or the index plan)
        run: |
          node -e '
            const {parse}=require("yaml");const fs=require("fs");
            const want=(process.env.RESOURCES||"").split(",").map(s=>s.trim()).filter(Boolean);
            let sel=want;
            if(!sel.length&&fs.existsSync("catalog/index-plan.yaml")){
              const plan=parse(fs.readFileSync("catalog/index-plan.yaml","utf8"));
              sel=(plan.build||[]).filter(r=>r.ci!==false).map(r=>r.id);
            }
            console.log("selected:",sel.join(", ")||"none");
            fs.appendFileSync(process.env.GITHUB_OUTPUT,`matrix=${JSON.stringify({resource:sel.length?sel:["none"]})}\n`);'
        env:
          RESOURCES: ${{ inputs.resources }}

  build:
    needs: plan
    if: ${{ needs.plan.outputs.matrix != '' && !contains(needs.plan.outputs.matrix, '"none"') }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

      # Les points de contrôle du builder (ADR 0012) : un job qui expire reprend là où il était au run suivant.
      - uses: actions/cache@v4
        with:
          path: build
          key: index-${{ matrix.resource }}-${{ inputs.model || 'bge-m3' }}-${{ github.run_id }}
          restore-keys: index-${{ matrix.resource }}-${{ inputs.model || 'bge-m3' }}-

      - name: Build shard ${{ matrix.resource }}
        run: scripts/index/build.sh ${{ matrix.resource }} build/index ${{ inputs.model || 'bge-m3' }}

      - name: Upload to Internet Archive
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          pip install --quiet internetarchive
          scripts/index/upload-ia.sh build/index/build.json

      - name: Update catalog entry (index block)
        run: npx tsx scripts/index/update-catalog.ts build/index/build.json

      - name: Validate catalog
        run: npx tsx src/cli.ts catalog validate

      - uses: actions/upload-artifact@v4
        with:
          name: index-${{ matrix.resource }}-meta
          path: |
            build/index/build.json
            build/index/*.sha256
            .catalog-reports/

      - name: Open PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: index/${{ matrix.resource }}
          delete-branch: true
          commit-message: "catalog: index shard for ${{ matrix.resource }} published (${{ github.run_id }})"
          title: "index: ${{ matrix.resource }} — nouveau shard hébergé / new hosted shard"
          body-path: .catalog-reports/index-${{ matrix.resource }}.md
          labels: catalog, index, automated, catalog-sensitive   # nouvelle URL + hachage : relecture à deux, jamais fusionné par un robot (M2-3)
          add-paths: catalog/**
