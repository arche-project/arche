# Taxonomie des vues : ce qu'il faut VOIR pour comprendre ou reconnaître un concept, par domaine.
# View taxonomy: what one must SEE to understand or identify a concept, per domain.
#
# C'est ce qui transforme « il faut des milliers d'images » en une mesure : pour chaque concept, la
# liste des vues requises est finie et connue d'avance. `arche visuals coverage` compte celles qui
# manquent. `diagnostic: true` marque les vues sans lesquelles on ne peut PAS identifier — pour
# celles-là, seule une photographie ou une planche réelle avec provenance est admise ; jamais une
# image générée (voir docs/fr/VISUELS.md).
#
# This turns "thousands of images" into a metric. `diagnostic: true` views admit only real
# photographs or plates with provenance — never generated images.

version: 1
updated: 2026-09-11

kinds:
  plant:
    label: { fr: "Plante", en: "Plant" }
    views:
      habit:        { label: { fr: "Port général", en: "Habit" }, required: true, diagnostic: true }
      leaf:         { label: { fr: "Feuille (face et revers)", en: "Leaf (both sides)" }, required: true, diagnostic: true }
      flower:       { label: { fr: "Fleur", en: "Flower" }, required: true, diagnostic: true }
      fruit_seed:   { label: { fr: "Fruit et graine", en: "Fruit and seed" }, required: true, diagnostic: true }
      stem_bark:    { label: { fr: "Tige ou écorce", en: "Stem or bark" }, required: true, diagnostic: true }
      root:         { label: { fr: "Racine, bulbe ou rhizome", en: "Root, bulb or rhizome" }, required: false, diagnostic: true }
      seedling:     { label: { fr: "Plantule", en: "Seedling" }, required: false, diagnostic: true }
      cross_section: { label: { fr: "Coupe (tige, fruit)", en: "Cross-section" }, required: false, diagnostic: false }
      micrograph:   { label: { fr: "Microscopie (pollen, épiderme) quand c'est discriminant", en: "Micrograph when diagnostic" }, required: false, diagnostic: true }
      lookalike:    { label: { fr: "Sosie dangereux, côte à côte", en: "Dangerous lookalike, side by side" }, required: true, diagnostic: true }
      plate:        { label: { fr: "Planche botanique (dessin d'ensemble)", en: "Botanical plate" }, required: false, diagnostic: false }
