      symptom_fruit: { label: { fr: "Symptôme sur fruit ou tige", en: "Symptom on fruit or stem" }, required: false, diagnostic: true }
      organism:     { label: { fr: "L'organisme lui-même (insecte, champignon)", en: "The organism itself" }, required: true, diagnostic: true }
      lookalike:    { label: { fr: "Carence ou stress qui y ressemble", en: "Deficiency or stress that mimics it" }, required: false, diagnostic: true }

  tool:
    label: { fr: "Outil à main", en: "Hand tool" }
    views:
      whole:        { label: { fr: "Outil entier, nommé", en: "Whole tool, named" }, required: true, diagnostic: false }
      parts:        { label: { fr: "Pièces nommées (éclaté)", en: "Named parts (exploded)" }, required: true, diagnostic: false }
