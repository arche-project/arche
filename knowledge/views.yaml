# Provenance admise par type de vue. `generated` n'est JAMAIS admis pour une vue diagnostique.
provenance:
  photo:      { label: { fr: "Photographie", en: "Photograph" }, diagnostic_ok: true }
  micrograph: { label: { fr: "Microscopie", en: "Micrograph" }, diagnostic_ok: true }
  plate:      { label: { fr: "Planche scientifique historique (BHL, Commons)", en: "Historical scientific plate" }, diagnostic_ok: true }
  drawing:    { label: { fr: "Dessin technique / schéma", en: "Technical drawing / diagram" }, diagnostic_ok: false }
  render:     { label: { fr: "Rendu CAO (FreeCAD, OpenSCAD, KiCad)", en: "CAD render" }, diagnostic_ok: false }
  generated:  { label: { fr: "Image générée par IA — étiquetée, jamais pour identifier", en: "AI-generated — labelled, never for identification" }, diagnostic_ok: false }
