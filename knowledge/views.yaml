      cap:          { label: { fr: "Chapeau (dessus)", en: "Cap (top)" }, required: true, diagnostic: true }
      hymenium:     { label: { fr: "Lames, pores ou aiguillons (dessous)", en: "Gills, pores or spines" }, required: true, diagnostic: true }
