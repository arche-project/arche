  animal:
    label: { fr: "Animal (élevage, gibier, nuisible)", en: "Animal" }
    views:
      habit:        { label: { fr: "Animal entier", en: "Whole animal" }, required: true, diagnostic: true }
      tracks_signs: { label: { fr: "Traces, fientes, dégâts", en: "Tracks, droppings, damage" }, required: false, diagnostic: true }
      anatomy:      { label: { fr: "Anatomie (planche)", en: "Anatomy plate" }, required: false, diagnostic: false }
      health_signs: { label: { fr: "Signes de maladie visibles", en: "Visible disease signs" }, required: false, diagnostic: true }
