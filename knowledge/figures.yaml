# Les chiffres de l'autonomie, en lisible-machine.
# The numbers of self-reliance, machine-readable.
#
# Ce fichier est la source unique des ordres de grandeur utilisés par les calculateurs
# (src/core/rag/figures.ts) et par la fiche imprimable 08. Le LLM n'invente jamais un nombre :
# il appelle un calculateur, qui lit ce fichier.
#
# Single source of truth for the sizing figures. The LLM never invents a number: it calls a
# calculator, which reads this file.
#
# Règle d'édition (M4-1, docs/fr/PROVENANCE.md) : toute valeur porte une fourchette (`lo`/`hi`) quand
# elle en a une, et `source: { resource, path, quote }` — un locator vers le corpus du catalogue, avec
# la citation. En période de grâce, `unsourced: true`, explicite : compté, publié dans le README, à
# rattacher ou retirer par M4-2. `verified` n'est jamais écrit ici : `arche knowledge verify` le
# calcule en ouvrant les shards installés. Une valeur sans l'un ni l'autre fait échouer la CI.
# Climat de référence : tempéré océanique / semi-continental (France, Europe de l'Ouest).

