# Les cultures du potager, en lisible-machine — la donnée que lit le planificateur de parcelles.
# Garden crops, machine-readable — the data the plot planner reads.
#
# Règle (ADR 0010) : le LLM ne planifie pas un potager de tête. Il appelle `garden_plan`, qui lit ce
# fichier et l'inventaire de l'utilisateur, et rend un calendrier qu'il peut expliquer, pas inventer.
#
# Chaque fiche porte :
#   family            famille botanique (rotation : jamais deux ans de suite au même endroit)
#   sun               full | partial — exposition minimale
#   frost_hardy       true si la plante supporte les gelées légères
#   sow               fenêtres en SEMAINES par rapport à la dernière gelée (négatif = avant) ;
#                     `indoor` = semis au chaud puis `transplant` ; `direct` = semis en place ;
#                     `anchor: first_frost` = plantation d'automne (ail), comptée avant la 1re gelée
#   spacing_cm        rang × plant ; sert à convertir un nombre de plants en surface
#   days_to_harvest   jours entre plantation (repiquage ou semis direct) et première récolte
#   harvest_weeks     durée de la fenêtre de récolte
#   succession_weeks  intervalle de semis échelonnés (radis, laitue, haricot) — facultatif
#   yield_kg_per_m2   fourchette de rendement amateur, climat tempéré
#   plants_per_person nombre de plants « raisonnable » par personne et par an, quand l'inventaire
#                     donne des semences sans quantité
#   source            { resource, path, quote } : le locator vers le corpus (fiche OpenFarm, manuel…)
#                     qui couvre les nombres de la fiche ; une valeur peut porter le sien (M4-1)
#   unsourced         true, explicite, tant qu'aucun locator n'est écrit — compté, publié (période
#                     de grâce, M4-2) ; `verified` n'est jamais écrit : `arche knowledge verify` le calcule
#
# Sources : espacement et exposition dérivés d'OpenFarm (CC0, ressource `openfarm-crops-rescue`) ;
# fenêtres de semis, durées et rendements : pratique maraîchère tempérée (France, plaine), ordres de
# grandeur ±30 %. Toute fiche `unsourced: true` est signalée comme telle dans le plan produit.
# Climat de référence : tempéré, dernière gelée ~10 mai, première gelée ~25 octobre (Île-de-France).

version: 1
updated: 2026-09-11
climate: temperate
defaults:
  last_frost: "05-10"
