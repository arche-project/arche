# Jeu d'évaluation de la base (audit, décision 3 : mesurer avant d'ajouter ; ticket M1-6).
# Retrieval evaluation set — 60 questions with expected corpus, locator, required words, guardrail.
#
# Sans ce fichier, « l'assistant marche bien » est une opinion. Avec lui, c'est un chiffre :
# `arche eval` (M1-7) lance chaque question contre les corpus installés et rend rappel@5, MRR,
# taux de garde-fous justes, taux de « je ne trouve pas » juste sur les négatives.
#
# Le schéma est knowledge/eval.schema.json ; tests/eval.test.ts le vérifie et vérifie en plus :
# 60 entrées, ids uniques, chaque ressource citée existe dans le catalogue, chaque question a au
# moins une ressource du plan d'indexation, les garde-fous se déclenchent vraiment (règles de
# src/core/rag/prompt.ts) et seulement là où ils sont attendus, 12 garde-fous, 15 négatives.
#
# Champs :
#   id         identifiant stable (<sujet>-<nn>) ; les tableaux d'eval s'y réfèrent
#   q          la question telle qu'un utilisateur la pose (fautes et abréviations comprises)
#   lang       fr | en
#   topic      eau | energie | culture | construction | electronique | entrainement |
#              premiers-secours | plantes | veterinaire | hors-base
#   expect     ressources du catalogue dont AU MOINS UNE doit remonter dans les 5 premiers extraits
#              (vide pour une question négative)
#   locator    où est la réponse : { resource, where, status, article?, chunk? }
#              resource : la ressource qui la porte (∈ expect) · where : repère humain (chapitre,
#              section, page) · status : pending tant qu'aucun shard publié ne permet de la résoudre,
#              resolved quand `chunk` (= resource/path#byte_offset, ADR 0014) a été vérifié ·
#              article : chemin dans la source quand il est connu (fichier de docs/ pour arche-docs)
#   must       mots obligatoires dans la réponse, insensibles à la casse et aux accents ;
#              « a|b » = l'un des deux suffit ; tous les éléments de la liste sont exigés
#   flag       garde-fou attendu : emergency | identification | dosage | diagnosis
#   negative   true = hors base : la bonne réponse est « je ne trouve pas dans la bibliothèque »
#   calculator calculateur attendu quand la question est un dimensionnement (exemple, ADR 0013 §2)
#   why        ce que la question teste
#
# Comptes : 60 questions = 33 positives + 12 avec garde-fou + 15 négatives (disjointes).
# Première vague de shards (M4-3) : les entrées `wave: 1` de catalog/index-plan.yaml.

version: 2
updated: 2026-09-12

# Seuil CI (M1-7) : `arche eval` rend le code 1 sous ces taux, calculés sur les positives MESURABLES
# (au moins un corpus attendu installé) — en CI, sur le corpus fixture `arche-docs` construit depuis
# docs/ en FTS5 seul (pas d'Ollama). recall_at_5 : un extrait d'un corpus attendu dans les 5 premiers
# (fusion) ; must_at_5 : cet extrait porte les mots obligatoires. Une modification qui fait baisser le
# tableau sous ces valeurs ne se fusionne pas ; on ne les baisse jamais, on les monte quand la mesure le permet.
threshold: { recall_at_5: 1.0, must_at_5: 0.75 }

